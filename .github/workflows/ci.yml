name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_PROVIDER: mock   # no keys, no network to the LLM provider

jobs:
  tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Run tests with coverage gate
        run: >
          python -m pytest -q -m "not integration"
          --cov=energy_forecast --cov-report=term-missing --cov-fail-under=80

  integration:
    name: Pipeline integration (versioned sample, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      # Only the integration tests that run offline: the real Open-Meteo / NVIDIA calls stay local.
      - name: ingest → train → forecast on data/energy_weather_es_hourly_sample.csv
        run: python -m pytest -q -m integration tests/test_integration.py tests/domain/test_validator.py
